<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UERN — Notícias e Editais</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,500;0,600;0,700;0,900;1,700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  
  <header class="bug-institucional">
    <div class="bug-institucional__logo" aria-label="Logomarca UERN">UERN</div>
    <span class="bug-institucional__divisor" aria-hidden="true"></span>
    <span class="bug-institucional__modo">Notícias</span>
  </header>

  <!--
    Palco do carrossel: contém 3 cards (anterior, atual, próximo).
    Só o card "atual" fica legível; os outros dois são só a "espiada"
    (peek) nas bordas, cortados pelo overflow do palco.
  --> 
    
  <main class="palco-carrossel">

    <!-- Card anterior (espiado, fica cortado à esquerda) -->
    <article class="card-conteudo card-conteudo--peek card-conteudo--anterior" data-tom="ciano" aria-hidden="true">
      <div class="card-conteudo__fantasma">CARREGANDO</div>
    </article>

    <!-- Card atual: o único com conteúdo legível -->
    <article class="card-conteudo card-conteudo--ativo" data-tom="azure">
      <div class="card-conteudo__fantasma">CARREGANDO</div>

      <div class="card-conteudo__miolo">
        
        <h1 class="card-conteudo__titulo">
          Carregando conteúdos...
        </h1>

        
        <div class="card-conteudo__detalhes">
          <div class="card-conteudo__texto">
            <p class="card-conteudo__resumo">
              Aguarde enquanto os conteúdos ativos são carregados.
            </p>

            <footer class="card-conteudo__rodape">
              <span class="card-conteudo__fonte">WebCarrossel</span>
              <span class="card-conteudo__ponto" aria-hidden="true">•</span>
              <span class="card-conteudo__data"></span>
            </footer>
          </div>
          <div id="qrcode-container" aria-label="QR code para acessar a notícia"></div>
        </div>
      </div>
    </article>

    <!-- Card próximo (espiado, fica cortado à direita) -->
    <article class="card-conteudo card-conteudo--peek card-conteudo--proximo" data-tom="azure-claro" aria-hidden="true">
      <div class="card-conteudo__fantasma">CARREGANDO</div>
    </article>

  </main>

  <!-- Barra de progresso: só sob a largura do card atual -->
  <div class="barra-progresso" role="presentation">
    <div class="barra-progresso__preenchimento"></div>
  </div>

  <a class="atalho-suporte" href="../painel/index.html" aria-label="Abrir painel de suporte">
    Suporte
  </a>

  <button id="btn-fullscreen" onclick="entrarFullscreen()" aria-label="Tela cheia">⛶</button>

  <style>
    #btn-fullscreen {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      z-index: 9999;
      background: rgba(0,0,0,0.35);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.4rem 0.7rem;
      font-size: 1.4rem;
      cursor: pointer;
      opacity: 0.4;
      transition: opacity 0.2s;
    }
    #btn-fullscreen:hover { opacity: 1; }
    :fullscreen #btn-fullscreen,
    :-webkit-full-screen #btn-fullscreen { display: none; }
  </style>

  <script>
    function entrarFullscreen() {
      const el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    }
  </script>
 
  
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script> 

  <script src="carrossel.js"></script>
</body>
</html>
